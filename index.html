<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3050E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English for Two">
<meta name="description" content="תרגול אנגלית אינטראקטיבי לשניים, בדיבור ובכתיבה.">
<title>English for Two</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* Layout: one narrow column. Sticky top bar with player switch, activity below. Hebrew UI; English in LTR blocks. */
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#1A2140; --mut:#5C6584; --line:#DCE2F0;
  --brand:#3050E0; --brand-ink:#FFFFFF; --alt:#0E8C7F; --gold:#F2B705;
  --ok:#18874A; --okbg:#DFF5E8; --bad:#C0392B; --badbg:#FBE3E0;
  --shadow:0 6px 18px rgba(26,33,64,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --card:#172038; --ink:#EDF0FA; --mut:#A3ACC8; --line:#2A3558;
    --brand:#6B8CFF; --brand-ink:#0B1020; --alt:#37C7B7; --gold:#FFC93C;
    --ok:#4CC882; --okbg:#153626; --bad:#FF7B6B; --badbg:#3D1D1A; --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:620px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--alt);outline-offset:2px}
h1,h2{margin:.2em 0;line-height:1.25;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.35rem}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.muted{color:var(--mut)} .small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center} .row.between{justify-content:space-between}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.wide{width:100%}

/* top bar */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{background:none;border:0;padding:0;font-size:1.2rem;font-weight:800;cursor:pointer}
.brand em{font-style:normal;color:var(--brand)}
#who{display:flex;gap:6px;margin-inline-start:auto}

/* buttons and pills */
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:12px 18px;font-size:1rem;font-weight:700;min-height:48px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.ghost:disabled{opacity:.5}
.link{background:none;border:0;color:var(--brand);padding:6px;font-size:.95rem;cursor:pointer}
.danger{color:var(--bad)}
.pill{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.small-btn{padding:8px 12px;min-height:40px;font-size:.92rem}
.mic{width:76px;height:76px;border-radius:50%;background:var(--alt);color:#fff;border:0;font-weight:800;cursor:pointer;font-size:1rem}
.mic:disabled{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(55,199,183,.25)}}
@media (prefers-reduced-motion:reduce){.mic:disabled{animation:none}}

/* home */
.hero{margin:18px 0 12px}
.sessions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.session{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--brand);color:var(--brand-ink);border:0;border-radius:18px;padding:18px;min-height:120px;cursor:pointer}
.session.alt{background:var(--alt);color:#fff}
.session b{font-size:1.4rem} .session span{font-size:.9rem;opacity:.92}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.menu button{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:104px;cursor:pointer;box-shadow:var(--shadow)}
.menu b{font-size:1.1rem} .menu span{color:var(--mut);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:12px}
.stats b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums} .stats span{color:var(--mut);font-size:.85rem}
@media (max-width:340px){.sessions,.menu{grid-template-columns:1fr}}

/* activity runner */
.progress{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.progress .bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s}
.prompt{font-size:1.5rem;font-weight:700;text-align:center;text-wrap:balance}
.prompt.en{direction:ltr}
.big-word{font-size:2.2rem}
.opt{width:100%;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:52px;cursor:pointer;font-size:1.05rem}
.opt.en{direction:ltr}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.picked{border-color:var(--brand);background:var(--card)}
.opt:disabled{cursor:default}
.fb{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-top:12px}
.fb.ok{background:var(--okbg);border-color:transparent}
.fb.bad{background:var(--badbg);border-color:transparent}
.fb .btn{margin-top:10px}
.answer{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:14px;justify-content:center;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--card);border:1.5px solid var(--brand);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:1.05rem;cursor:pointer;direction:ltr}
.tile.answer-tile{background:var(--brand);color:var(--brand-ink)}
.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:1.2rem;direction:ltr}
.tok{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:1.15rem;cursor:pointer}
.tok.right{border-color:var(--ok);background:var(--okbg)}
.tok.wrong{border-color:var(--bad);background:var(--badbg)}
.lbl{font-size:.9rem;color:var(--mut)}
.center{text-align:center;justify-content:center}

/* scene chat */
.scene-head{margin-bottom:8px}
.log{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px 2px}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;font-size:1.02rem;overflow-wrap:anywhere}
.bub.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.bub.me{background:var(--brand);color:var(--brand-ink);align-self:flex-end;border-top-right-radius:4px}
.bub .en{direction:ltr}
.note-line{align-self:center;max-width:95%;text-align:center;font-size:.92rem;padding:7px 12px;border-radius:12px}
.note-line.best{background:var(--okbg);color:var(--ok)}
.note-line.ok{background:var(--card);border:1px dashed var(--line)}
.note-line.off{background:var(--badbg);color:var(--bad)}
.choice{width:100%;text-align:start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:50px;cursor:pointer;font-size:1.02rem;direction:ltr}
.choice:active{transform:scale(.99)}
.choice:disabled{opacity:.6}

/* words */
.wrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);flex-wrap:wrap}
.x{background:none;border:0;color:var(--bad);font-size:1.5rem;cursor:pointer;padding:0 6px}
.wrow .en{min-width:110px}

/* duel */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score-line{font-size:1.1rem;text-align:center;font-variant-numeric:tabular-nums}

/* profile */
label{display:flex;flex-direction:column;gap:6px}
label.inline{flex-direction:row;align-items:center;gap:10px}
input:not([type=range]):not([type=checkbox]){width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{width:100%}
input[type=checkbox]{width:22px;height:22px}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}

/* toast */
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;max-width:520px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand">English <em>for Two</em></button>
    <div id="who" role="group" aria-label="מי לומד עכשיו"></div>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ==========================================================
   English for Two: static content, per-learner progress in localStorage.
   Speech uses the browser's built-in voices (speechSynthesis / SpeechRecognition).
   ========================================================== */

const KEY = 'english-for-two-v1';
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
const LEVELS = ['A2', 'B1', 'B2', 'C1'];
const TRACKS = { fun: 'קומדיה', crime: 'פשע', tech: 'AI ואוטומציה', work: 'עבודה', daily: 'יומיום' };

/* ---------- content ---------- */

// Branching scenes. Each choice has q: 'best' | 'ok' | 'off' and a note in Hebrew.
const SCENES = [
  {
    id: 'coffee', track: 'daily', level: 'A2', title: 'Coffee Order', he: 'מזמינים קפה, ואז מתברר שאין חלב שיבולת שועל', start: 'c1',
    vocab: [
      { en: 'out of stock', he: 'אזל מהמלאי', ex: 'Sorry, the oat milk is out of stock.' },
      { en: 'to go', he: 'לקחת איתי', ex: 'A large latte to go, please.' },
      { en: 'instead', he: 'במקום', ex: 'Could I have almond milk instead?' }
    ],
    nodes: {
      c1: { say: 'Hi there! What can I get for you?', ch: [
        { t: 'Hi! Can I get a large latte, please?', q: 'best', n: 'ברור, מנומס ומלא.', next: 'c2' },
        { t: 'Give me a coffee.', q: 'ok', n: 'מובן, אבל "please" הופך את זה לטבעי.', next: 'c2' },
        { t: 'I want coffee now.', q: 'off', n: 'ישיר מדי. נסו "Can I get...?"', next: 'c2' }
      ] },
      c2: { say: 'Sure! Oat milk is out of stock today. Would you like almond instead?', ch: [
        { t: 'Sounds good. Almond milk, please.', q: 'best', n: 'קצר, ברור, ומקבל את ההצעה.', next: 'c3' },
        { t: 'No, I want oat.', q: 'ok', n: 'ברור, אבל קצת חד. נסו "Oh, no problem. Can I have...?"', next: 'c3' },
        { t: 'Why is it out of stock?', q: 'ok', n: 'שאלה טובה, אבל הברמנית רוצה קודם את ההזמנה.', next: 'c3' }
      ] },
      c3: { say: 'Almond it is! Anything else? We have a cake this morning.', ch: [
        { t: "No, thanks. That's all. It's to go, please.", q: 'best', n: 'סיום מושלם. "To go" הוא הביטוי המפתח.', next: 'end' },
        { t: 'Yes, I will take the cake, please.', q: 'best', n: 'חברותי וטבעי.', next: 'end' },
        { t: 'Cake? No, bye.', q: 'off', n: 'קצר מדי. הוסיפו "thanks" כדי להישמע מנומסים.', next: 'end' }
      ] },
      end: { end: true, say: 'Here is your latte. Have a great day!', result: 'הזמנה הושלמה!' }
    }
  },
  {
    id: 'sapphire', track: 'crime', level: 'B1', title: 'The Missing Sapphire', he: 'אתם הבלש/ית. המשרת מדבר, אבל יש לו סוד', start: 's1',
    vocab: [
      { en: 'suspect', he: 'חשוד', ex: 'The butler is the main suspect.' },
      { en: 'alibi', he: 'אליבי, הוכחה שהיה במקום אחר', ex: 'Do you have an alibi for midnight?' },
      { en: 'witness', he: 'עד ראייה', ex: 'Is there a witness who saw you?' }
    ],
    nodes: {
      s1: { say: "Good evening, Detective. I'm Mr. Dunn. I've already told the police everything. Why are you here again?", ch: [
        { t: 'Because I need you to go over it once more. Where were you at midnight?', q: 'best', n: 'ישיר וחד, בדיוק כמו בלש אמיתי.', next: 's2' },
        { t: 'Why do you look so nervous?', q: 'ok', n: 'תצפית טובה, אבל קודם שואלים על העובדות.', next: 's2' },
        { t: 'Relax, you are not a suspect.', q: 'off', n: 'אף פעם לא מוותרים על זה מוקדם. עכשיו הוא יודע שבודקים אותו.', next: 's2' }
      ] },
      s2: { say: 'I was in the kitchen, I swear. Nobody saw me. Nobody.', ch: [
        { t: 'Can anyone confirm that?', q: 'best', n: 'שאלה מצוינת, כי היא מחפשת עד.', next: 's3' },
        { t: 'Did you go near the safe?', q: 'ok', n: 'שאלה טובה, אבל היא חושפת יותר מדי מוקדם.', next: 's3' },
        { t: 'I do not believe you.', q: 'off', n: 'השיחה נגמרת. נסו להישאר סקרנים, לא כועסים.', next: 'end_bad' }
      ] },
      s3: { say: 'Well... the cook might have seen me. And maybe I borrowed something from the safe. Just for a moment.', ch: [
        { t: 'Borrowed? What exactly did you borrow?', q: 'best', n: 'שאלות המשך הן מה שבלשים עושים.', next: 'end_win' },
        { t: 'It sounds like you are hiding something.', q: 'ok', n: 'ברור, אבל שאלה מוציאה יותר תשובות מקביעה.', next: 'end_win' },
        { t: 'Okay, you can go now.', q: 'off', n: 'נתתם לחשוד ללכת עם הסוד.', next: 'end_lose' }
      ] },
      end_win: { end: true, say: 'Fine, Detective. I was going to sell the sapphire, but I never got the chance. Here is the truth...', result: 'חקירה מעולה! הגעתם לאמת.' },
      end_lose: { end: true, say: 'Thank you, Detective. Good night.', result: 'החשוד ברח. נסו שוב ושאלו שאלות המשך.' },
      end_bad: { end: true, say: 'Then arrest me. I have nothing else to say.', result: 'עם טון פחות חד תקבלו תשובות יותר טובות.' }
    }
  },
  {
    id: 'roommate', track: 'fun', level: 'A2', title: 'Who Ate My Cake?', he: 'שותפה לדירה, עוגה שנעלמה, והאשמה ברורה', start: 'r1',
    vocab: [
      { en: 'to eat up', he: 'לאכול הכול', ex: 'Who ate up all the cake?' },
      { en: 'to blame', he: 'להאשים', ex: "Don't blame me, I was at work." },
      { en: 'to replace', he: 'להחליף', ex: 'I will replace the cake tomorrow.' }
    ],
    nodes: {
      r1: { say: 'Who ate my birthday cake?! It was in the fridge, and now it is gone!', ch: [
        { t: 'It was the dog, obviously.', q: 'best', n: 'מצחיק וטבעי. מתאים לסיטקום.', next: 'r2' },
        { t: 'I do not know what you are talking about.', q: 'ok', n: 'נכון, אבל קצת משעמם. נסו בדיחה.', next: 'r2' },
        { t: 'Maybe it was me. Sorry!', q: 'best', n: 'כנה וחברותי. בחירה טובה.', next: 'r2' }
      ] },
      r2: { say: 'The dog does not eat cake, and you know it! Be honest. Who did it?', ch: [
        { t: 'Okay, fine, it was me. I will buy you a new one. Deal?', q: 'best', n: 'מושלם. "Deal?" הוא דרך טבעית לסגור.', next: 'end_win' },
        { t: 'Sorry, I was really hungry.', q: 'ok', n: 'התנצלות טובה. הוסיפו תוכנית: "I will replace it."', next: 'end_win' },
        { t: 'You cannot prove anything.', q: 'off', n: 'מצחיק, אבל נשמע גס. נסו גרסה רכה יותר.', next: 'end_lose' }
      ] },
      end_win: { end: true, say: 'Okay, deal. But I want chocolate this time!', result: 'סיטקום גמור, ובלי כעס.' },
      end_lose: { end: true, say: 'Unbelievable. I am not speaking to you until tomorrow.', result: 'קהל קשוח. נסו את הגרסה הרכה בפעם הבאה.' }
    }
  },
  {
    id: 'demo', track: 'tech', level: 'B2', title: 'Client Demo', he: 'הצגת אוטומציה ללקוח שמבקש הסברים', start: 'd1',
    vocab: [
      { en: 'to flag', he: 'לסמן לבדיקה', ex: 'The system flags unusual invoices.' },
      { en: 'to review', he: 'לבדוק ולאשר', ex: 'A person will review the flagged items.' },
      { en: 'within minutes', he: 'תוך דקות', ex: 'Each invoice is processed within minutes.' }
    ],
    nodes: {
      d1: { say: 'So your tool reads invoices from email and enters them into our system. What happens if it reads one wrong?', ch: [
        { t: 'It flags the invoice, and a person reviews it before anything is saved.', q: 'best', n: 'תשובה ברורה שמראה שליטה. לקוחות אוהבים את זה.', next: 'd2' },
        { t: 'It just skips the invoice.', q: 'off', n: 'חשבונית שמדלגים עליה יכולה ללכת לאיבוד. הזכירו שלב בדיקה.', next: 'd2' },
        { t: 'I am not sure. Let me check and get back to you.', q: 'ok', n: 'כנה ותקין. הוסיפו זמן: "I will confirm by tomorrow."', next: 'd2' }
      ] },
      d2: { say: 'And how fast is it? We process hundreds of invoices a day.', ch: [
        { t: 'Most invoices are processed within minutes, and we review the flagged ones every day.', q: 'best', n: 'ספציפי ובטוח. נתתם גם מהירות וגם שליטה.', next: 'end_win' },
        { t: "It's pretty fast, I think.", q: 'ok', n: 'מובן, אבל מעורפל. מספרים מחזקים את התשובה.', next: 'end_win' },
        { t: 'Fast enough, I guess.', q: 'off', n: 'נשמע לא בטוח. הציגו בביטחון את המספרים.', next: 'end_lose' }
      ] },
      end_win: { end: true, say: 'That sounds good. Please send me a proposal.', result: 'הלקוח התרשם!' },
      end_lose: { end: true, say: 'Hmm. Let us think about it and talk next week.', result: 'ביטחון עושה הבדל. נסו שוב!' }
    }
  },
  {
    id: 'interview', track: 'work', level: 'B1', title: 'Job Interview', he: 'ראיון בחברה בלונדון. המנהלת רוצה לשמוע על הניסיון שלכם', start: 'i1',
    vocab: [
      { en: 'to be responsible for', he: 'להיות אחראי על', ex: 'I am responsible for planning the team.' },
      { en: 'to improve', he: 'לשפר', ex: 'We improved our delivery time by 20 percent.' },
      { en: 'to grow', he: 'לגדול, להתפתח', ex: 'The company is growing fast.' }
    ],
    nodes: {
      i1: { say: 'Thanks for coming in. Could you tell me about yourself?', ch: [
        { t: 'I am a project manager with five years of experience. I like solving problems that save time.', q: 'best', n: 'ברור, מקצועי, ויש בו עובדה מרכזית.', next: 'i2' },
        { t: 'I work in logistics, and I am a very hardworking person.', q: 'ok', n: 'מובן. עדיף "I am a hard worker" ותוצאה.', next: 'i2' },
        { t: 'I am a very good person and I like my family.', q: 'off', n: 'חם, אבל לא מה שהמראיינת שואלת. דברו על עבודה.', next: 'i2' }
      ] },
      i2: { say: 'Great. Why do you want to work with us?', ch: [
        { t: 'Your company is growing fast, and I want to help build a strong team.', q: 'best', n: 'מראה מחקר ומוטיבציה. מצוין.', next: 'end_win' },

/* ---------- state ---------- */

const blank = (name, level, tracks) => ({ name, level, tracks, rate: 0.95, speak: true, xp: 0, streak: 0, last: 0, words: [], done: {} });
let DB = null;
try { DB = JSON.parse(localStorage.getItem(KEY)); } catch (e) { DB = null; }
if (!DB || !DB.players) {
  DB = { cur: 'rafael', players: {
    rafael: blank('רפאל', 'B1', ['tech', 'work', 'daily']),
    shani: blank('שני', 'B1', ['fun', 'crime', 'work', 'daily'])
  } };
}
const me = () => DB.players[DB.cur];
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* storage blocked: keep working in memory */ } }

/* ---------- helpers ---------- */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const words = s => s.toLowerCase().replace(/’/g, "'").replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
const similar = (said, target) => { const t = words(target), s = new Set(words(said)); return t.length ? t.filter(w => s.has(w)).length / t.length : 0; };
const lvlOf = xp => Math.floor(xp / 150) + 1;
const rank = l => LEVELS.indexOf(l);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function addXP(n, id = DB.cur) {
  const p = DB.players[id], t = today();
  if (p.last !== t) { p.streak = p.last === t - 1 ? p.streak + 1 : 1; p.last = t; }
  p.xp += n; save();
}

/* word bank with spaced repetition (Leitner boxes) */
function addWord(w) {
  const p = me();
  if (p.words.some(x => x.en.toLowerCase() === w.en.toLowerCase())) return false;
  p.words.push({ en: w.en, he: w.he || '', ex: w.ex || '', box: 0, due: today() });
  save(); return true;
}
const dueWords = () => me().words.filter(w => w.due <= today()).sort((a, b) => a.box - b.box);
function grade(w, knew) {
  w.box = knew ? Math.min(BOX_DAYS.length - 1, w.box + 1) : 0;
  w.due = today() + BOX_DAYS[w.box]; save();
}

/* speech */
const TTS = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let VOICES = [];
function loadVoices() { if (TTS) VOICES = speechSynthesis.getVoices(); }
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  return VOICES.find(v => /en-US/i.test(v.lang) && /natural|google|samantha|aria/i.test(v.name)) || VOICES.find(v => /^en/i.test(v.lang)) || null;
}
function say(text, slow) {
  if (!TTS || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  const v = pickVoice(); if (v) u.voice = v;
  u.rate = (me().rate || 0.95) * (slow ? 0.7 : 1);
  speechSynthesis.speak(u);
}
const autoSay = text => { if (me().speak) say(text); };
function listen(cb) {
  if (!SR) { cb(null, 'unsupported'); return null; }
  const r = new SR();
  r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3;
  let got = false;
  r.onresult = e => { got = true; cb([...e.results[0]].map(a => a.transcript)); };
  r.onerror = e => { got = true; cb(null, e.error); };
  r.onend = () => { if (!got) cb(null, 'none'); };
  try { r.start(); return r; } catch (e) { cb(null, 'start'); return null; }
}

/* ---------- reusable pieces ---------- */

function feedback(root, ok, note, next) {
  fbBox(root, `<b>${ok ? 'נכון!' : 'לא בדיוק.'}</b> ${esc(note || '')}`, next, ok ? 'ok' : 'bad');
}
function fbBox(root, html, next, cls = '') {
  const fb = $('#fb', root);
  fb.innerHTML = `<div class="fb ${cls}">${html}<br><button class="btn wide" id="next">המשך</button></div>`;
  $('#next', root).onclick = next;
  $('#next', root).focus();
}

// Multiple choice. c: {label, prompt, opts, a, note, en, speak, sub, hidden, onWrong}
function mcq(root, c, done) {
  root.innerHTML = `<div class="card stack">
    <div class="row between"><span class="lbl">${esc(c.label || '')}</span>${c.speak ? '<button class="ghost small-btn" id="play">השמע</button>' : ''}</div>
    <div class="prompt ${c.en ? 'en' : ''}">${esc(c.prompt)}</div>
    ${c.sub ? `<div class="muted en">${esc(c.sub)}</div>` : ''}
    <div class="stack">${c.opts.map((o, i) => `<button class="opt ${c.en ? 'en' : ''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div></div>`;
  if (c.speak) $('#play', root).onclick = () => say(c.speak);
  let answered = false;
  $$('.opt', root).forEach(b => b.onclick = () => {
    if (answered) return;
    answered = true;
    const i = +b.dataset.i, ok = i === c.a;
    $$('.opt', root).forEach(x => x.disabled = true);
    if (c.hidden) {
      b.classList.add('picked');
      fbBox(root, 'התשובה נשמרה. העבירו את הטלפון.', () => done({ ok, xp: 0 }));
      return;
    }
    $$('.opt', root).forEach((x, j) => { if (j === c.a) x.classList.add('right'); else if (j === i) x.classList.add('wrong'); });
    if (!ok && c.onWrong) c.onWrong();
    feedback(root, ok, c.note, () => done({ ok, xp: ok ? 10 : 2 }));
  });
}

/* ---------- activities ---------- */

function drillUI(root, d, done) {
  if (d.type === 'mc') {
    const opts = shuffle([d.he, ...d.wrong]);
    return mcq(root, {
      label: 'מה פירוש המילה?', prompt: d.w, en: true, speak: d.w, sub: d.ex,
      opts, a: opts.indexOf(d.he), note: d.ex ? `דוגמה: ${d.ex}` : '',
      onWrong: () => addWord({ en: d.w, he: d.he, ex: d.ex })
    }, done);
  }
  if (d.type === 'gap') {
    return mcq(root, { label: 'השלימו את החסר', prompt: d.s, en: true, opts: d.opts, a: d.a, note: d.note }, done);
  }
  if (d.type === 'build') return buildUI(root, d, done);
  if (d.type === 'spot') return spotUI(root, d, done);
  if (d.type === 'say') return sayUI(root, d, done);
}

function buildUI(root, d, done) {
  let ans = [], locked = false;
  const tiles = d.words.map((w, i) => ({ w, i }));
  const bank = shuffle(tiles);
  root.innerHTML = `<div class="card stack">
    <span class="lbl">סדרו את המשפט</span>
    <div class="hint">${esc(d.he)}</div>
    <div class="answer" id="ans"></div>
    <div class="tiles" id="bank"></div>
    <div class="row between"><button class="ghost small-btn" id="reset">מחיקה</button><button class="btn" id="check">בדיקה</button></div>
    <div id="fb"></div></div>`;
  const draw = () => {
    $('#ans', root).innerHTML = ans.length
      ? ans.map(t => `<button class="tile answer-tile" data-u="${t.i}">${esc(t.w)}</button>`).join('')
      : '<span class="muted small">לחצו על המילים כדי לבנות את המשפט</span>';
    $('#bank', root).innerHTML = bank.filter(t => !ans.includes(t)).map(t => `<button class="tile" data-i="${t.i}">${esc(t.w)}</button>`).join('');
    $$('#bank .tile', root).forEach(b => b.onclick = () => { if (!locked) { ans.push(bank.find(t => t.i === +b.dataset.i)); draw(); } });
    $$('#ans .tile', root).forEach(b => b.onclick = () => { if (!locked) { ans = ans.filter(t => t.i !== +b.dataset.u); draw(); } });
  };
  $('#reset', root).onclick = () => { if (!locked) { ans = []; draw(); } };
  $('#check', root).onclick = () => {
    if (locked) return;
    if (!ans.length) { toast('בנו קודם משפט'); return; }
    locked = true;
    const ok = words(ans.map(t => t.w).join(' ')).join(' ') === words(d.answer).join(' ');
    $('#check', root).disabled = true;
    say(d.answer);
    feedback(root, ok, ok ? d.note : `התשובה: ${d.answer}. ${d.note}`, () => done({ ok, xp: ok ? 10 : 2 }));
  };
  draw();
}

function spotUI(root, d, done) {
  const toks = d.s.split(' ');
  root.innerHTML = `<div class="card stack">
    <span class="lbl">מצאו את המילה הלא נכונה</span>
    <div class="sentence">${toks.map((t, i) => `<button class="tok" data-i="${i}">${esc(t)}</button>`).join('')}</div>
    <div id="fb"></div></div>`;
  let locked = false;
  $$('.tok', root).forEach(b => b.onclick = () => {
    if (locked) return;
    locked = true;
    const i = +b.dataset.i, ok = i === d.bad;
    b.classList.add(ok ? 'right' : 'wrong');
    if (!ok) $$('.tok', root)[d.bad].classList.add('right');
    feedback(root, ok, `${d.note} ${d.fixed}`, () => done({ ok, xp: ok ? 10 : 2 }));
  });
}

function sayUI(root, d, done) {
  root.innerHTML = `<div class="card stack center">
    <span class="lbl">אמרו את המשפט בקול</span>

    <div id="res" class="stack center"></div>
    <div id="fb"></div></div>`;
  $('#play', root).onclick = () => say(d.line);

    res.innerHTML = `<p class="muted small">אמרתם את המשפט? סמנו איך היה:</p>
      <div class="row center"><button class="ghost" id="no">לא הצלחתי</button><button class="btn" id="yes">אמרתי נכון</button></div>`;
    $('#no', root).onclick = () => feedback(root, false, 'נסו שוב בפעם הבאה. ככה משתפרים.', () => done({ ok: false, xp: 2 }));
    $('#yes', root).onclick = () => feedback(root, true, 'מעולה, בדיוק כך.', () => done({ ok: true, xp: 10 }));
  };

  $('#rec', root).onclick = () => {
    const btn = $('#rec', root);

    res.innerHTML = '<p class="muted small">מקשיב...</p>';
    listen((alts, err) => {

      const best = Math.max(...alts.map(a => similar(a, d.line)));

      feedback(root, ok, ok ? 'מדויק!' : 'כמעט. נסו לדייק את המילים.', () => done({ ok, xp: ok ? 10 : 2 }));
    });

}

function sceneUI(root, s, done) {
  const p = me();
  const log = [];
  let xp = 0, bests = 0, choices = 0;

  function show() {
    root.innerHTML = `<div class="scene-head"><h2 class="en">${esc(s.title)}</h2><p class="muted small">${esc(s.he)}</p></div>
      <div class="log" id="log">${log.map(x => x.kind === 'note'
        ? `<div class="note-line ${x.q}">${esc(x.t)}</div>`
        : `<div class="bub ${x.who}"><span class="en">${esc(x.t)}</span></div>`).join('')}</div>
      <div id="act" class="stack" style="margin-top:12px"></div>`;
    const logEl = $('#log', root);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function arrive(id) {
    const n = s.nodes[id];
    log.push({ who: 'them', t: n.say });
    autoSay(n.say);
    show();
    if (n.end) return finish(n);
    choicesUI(n);
  }
  function choicesUI(n) {
    const act = $('#act', root);
    act.innerHTML = `${n.ch.map((c, i) => `<button class="choice" data-i="${i}">${esc(c.t)}</button>`).join('')}
      <div class="row between"><button class="ghost small-btn" id="mic">${SR ? 'דברו את התשובה' : ''}</button><span class="muted small" id="heard"></span></div>`;
    $$('.choice', act).forEach(b => b.onclick = () => pick(n, +b.dataset.i));
    const mic = $('#mic', act);
    if (!SR) mic.hidden = true;
    mic.onclick = () => {
      mic.disabled = true;
      $('#heard', act).textContent = 'מקשיב...';
      listen((alts) => {
        mic.disabled = false;
        if (!alts) { $('#heard', act).textContent = 'לא שמעתי. נסו שוב או לחצו על תשובה.'; return; }
        let best = -1, score = 0;
        n.ch.forEach((c, i) => alts.forEach(a => { const v = similar(a, c.t); if (v > score) { score = v; best = i; } }));
        if (score >= 0.5) pick(n, best);
        else $('#heard', act).textContent = `שמעתי: "${alts[0]}". לא זיהיתי תשובה. נסו שוב.`;
      });
    };
  }
  function pick(n, i) {
    const c = n.ch[i];
    choices++; if (c.q === 'best') bests++;
    xp += c.q === 'best' ? 10 : c.q === 'ok' ? 5 : 2;
    log.push({ who: 'me', t: c.t });
    log.push({ kind: 'note', q: c.q, t: (c.q === 'best' ? 'מצוין: ' : c.q === 'ok' ? 'אפשר טוב יותר: ' : 'לא הכי מתאים: ') + c.n });
    show();
    $('#act', root).innerHTML = '<button class="btn wide" id="cont">המשך</button>';
    $('#cont', root).onclick = () => arrive(c.next);
  }
  function finish(n) {
    const act = $('#act', root);
    act.innerHTML = `${n.result ? `<div class="fb ok">${esc(n.result)}</div>` : ''}
      <div class="card stack"><b>מילים מהסצנה</b>
        ${s.vocab.map(v => `<div class="row between"><span class="en"><b>${esc(v.en)}</b></span><span>${esc(v.he)}</span></div>`).join('')}
        <button class="ghost wide" id="save">שמרו את המילים למחסן</button></div>
      <button class="btn wide" id="done">סיום</button>`;
    $('#save', root).onclick = e => {
      const added = s.vocab.filter(v => addWord(v)).length;
      e.currentTarget.textContent = added ? `נוספו ${added} מילים למחסן` : 'המילים כבר במחסן';
      e.currentTarget.disabled = true;
    };
    $('#done', root).onclick = () => {
      p.done[s.id] = Date.now(); save();
      done({ ok: bests >= Math.ceil(choices / 2), xp: xp + 10 });
    };
  }
  arrive(s.start);
}

/* ---------- session runner ---------- */

function pickDrills(n) {
  const p = me();
  const pool = DRILLS.filter(d => p.tracks.includes(d.t) || d.t === 'daily' || d.t === 'work');
  return shuffle(pool.length >= n ? pool : DRILLS).slice(0, n);
}
function pickScene() {
  const p = me();
  const cand = SCENES.filter(s => p.tracks.includes(s.track) && rank(s.level) <= rank(p.level) + 1);
  // never-played scenes first, then the least recently played; shuffle first so ties vary
  return shuffle(cand.length ? cand : SCENES).sort((a, b) => (p.done[a.id] || 0) - (p.done[b.id] || 0))[0];
}
function buildQueue(mins) {
  const q = [];
  if (mins >= 15) q.push({ k: 'scene', d: pickScene() });
  pickDrills(mins >= 15 ? 6 : 4).forEach(d => q.push({ k: 'drill', d }));
  dueWords().slice(0, mins >= 15 ? 8 : 4).forEach(w => q.push({ k: 'review', d: w }));
  return q;
}

function runQueue(queue, title) {
  const view = $('#view');
  view.innerHTML = `<div class="progress"><button class="link" id="quit">יציאה</button><div class="bar"><i id="pbar"></i></div><span class="small muted" id="pnum"></span></div><div id="stage"></div>`;
  $('#quit', view).onclick = () => go('home');
  const stage = $('#stage', view);
  const total = queue.length;
  let i = 0, right = 0, xp = 0;
  const step = () => {
    if (i >= total) return finish();
    $('#pbar', view).style.width = (i / total * 100) + '%';
    $('#pnum', view).textContent = `${i + 1} / ${total}`;
    const it = queue[i];
    const next = res => {
      if (res.ok) right++;
      xp += res.xp;
      if (res.xp) addXP(res.xp);
      if (it.k === 'review') grade(it.d, res.ok);
      i++; window.scrollTo(0, 0); step();
    };
    if (it.k === 'scene') sceneUI(stage, it.d, next);
    else if (it.k === 'drill') drillUI(stage, it.d, next);
    else flashUI(stage, it.d, next);
  };
  function finish() {
    save();
    view.innerHTML = `<div class="card stack center" style="margin-top:20px">
      <h2>כל הכבוד!</h2>
      <p class="muted">${title}</p>
      <p><b>${right}</b> מתוך ${total} נכונים</p>
      <p>+<b>${xp}</b> XP · רמה ${lvlOf(me().xp)} · רצף ${me().streak} ימים</p>
      <button class="btn wide" id="home">חזרה לבית</button></div>`;
    $('#home', view).onclick = () => go('home');
    renderTop();
  }
  step();
}

/* ---------- views ---------- */

let ROUTE = 'home';
const ROUTES = {};

function go(route, arg) {
  ROUTE = route;
  try { speechSynthesis.cancel(); } catch (e) { /* no speech support */ }
  renderTop();
  ROUTES[route](arg);
  window.scrollTo(0, 0);
}

function renderTop() {
  $('#who').innerHTML = ['rafael', 'shani'].map(id =>
    `<button class="pill ${id === DB.cur ? 'on' : ''}" data-p="${id}">${esc(DB.players[id].name)}</button>`).join('');
}

ROUTES.home = () => {
  const p = me(), due = dueWords().length;
  $('#view').innerHTML = `
    <section class="hero">
      <h1>היי ${esc(p.name)}</h1>
      <p class="muted">${due ? `${due} מילים מחכות לחזרה היום.` : 'אין מילים לחזרה היום. בואו נתרגל.'}</p>
    </section>
    <div class="sessions">
      <button class="session" data-m="5"><b>5 דקות</b><span>תרגילים קצרים וחזרה על מילים</span></button>
      <button class="session alt" data-m="20"><b>20 דקות</b><span>סצנה אינטראקטיבית, תרגילים וחזרה</span></button>
    </div>
    <div class="menu">
      <button data-go="scenes"><b>סצנות</b><span>שיחות עם בחירות, בדיבור או בלחיצה</span></button>
      <button data-go="practice"><b>תרגול</b><span>בחירה, השלמה, סידור משפטים ודיבור</span></button>
      <button data-go="duel"><b>דו-קרב</b><span>שניכם עונים על אותן שאלות בטלפון אחד</span></button>
      <button data-go="words"><b>מחסן מילים</b><span>${p.words.length} מילים שאספתם</span></button>
    </div>
    <div class="card stats">
      <div><b>${lvlOf(p.xp)}</b><span>רמה</span></div>
      <div><b>${p.xp}</b><span>XP</span></div>
      <div><b>${p.streak}</b><span>ימים ברצף</span></div>
    </div>`;
  $$('[data-m]', $('#view')).forEach(b => b.onclick = () => runQueue(buildQueue(+b.dataset.m), `סשן של ${b.dataset.m} דקות`));
  $$('[data-go]', $('#view')).forEach(b => b.onclick = () => go(b.dataset.go));
};

ROUTES.practice = () => runQueue(pickDrills(10).map(d => ({ k: 'drill', d })), 'תרגול');

ROUTES.scenes = () => {
  const p = me();
  $('#view').innerHTML = `<h2>סצנות</h2>
    <p class="muted">בוחרים תגובה בלחיצה או בדיבור. כל בחירה מקבלת משוב קצר.</p>
    <div class="stack">${SCENES.map(s => {
      const fits = p.tracks.includes(s.track);
      return `<button class="choice" data-s="${s.id}" style="${fits ? '' : 'opacity:.6'}">
        <b>${esc(s.title)}</b> <span class="muted small">${TRACKS[s.track]} · ${s.level}${p.done[s.id] ? ' · נעשה' : ''}</span>
        <div class="muted small" style="direction:rtl;text-align:right">${esc(s.he)}</div></button>`;
    }).join('')}</div>`;
  $$('[data-s]', $('#view')).forEach(b => b.onclick = () => runQueue([{ k: 'scene', d: SCENES.find(s => s.id === b.dataset.s) }], 'סצנה'));
};

ROUTES.words = () => {
  const p = me(), due = dueWords();
  $('#view').innerHTML = `<h2>מחסן המילים</h2>
    <p class="muted">חזרה במרווחים: מילה שזכרתם חוזרת אחרי יום, 3 ימים, שבוע ועוד. מילה ששכחתם חוזרת מההתחלה.</p>
    <button class="btn wide" id="rev" ${due.length ? '' : 'disabled'}>חזרה על ${due.length} מילים</button>
    <details class="card"><summary>הוספת מילה</summary>
      <div class="stack" style="margin-top:10px"><input id="wen" class="en" dir="ltr" placeholder="English word or phrase">
        <input id="whe" placeholder="תרגום בעברית"><button class="btn" id="add">הוספה</button></div></details>
    <div class="stack">${p.words.length
      ? p.words.slice().reverse().map(w => `<div class="wrow">
          <button class="ghost small-btn" data-say="${esc(w.en)}">השמע</button>
          <span class="en"><b>${esc(w.en)}</b></span><span class="muted">${esc(w.he)}</span>
          <span class="spacer"></span><span class="small muted">רמה ${w.box + 1}/${BOX_DAYS.length}</span>
          <button class="x" data-del="${esc(w.en)}" aria-label="מחיקה">×</button></div>`).join('')
      : '<p class="muted">עדיין ריק. מילים נשמרות מסצנות, מתרגילים שטעיתם בהם, או ידנית.</p>'}</div>`;
  $('#rev').onclick = () => runQueue(dueWords().map(w => ({ k: 'review', d: w })), 'חזרה על מילים');
  $('#add').onclick = () => {
    const en = $('#wen').value.trim();
    if (!en) return toast('כתבו מילה באנגלית');
    if (addWord({ en, he: $('#whe').value.trim() })) toast('נוספה למחסן');
    else toast('המילה כבר במחסן');
    ROUTES.words();
  };
  $$('[data-say]', $('#view')).forEach(b => b.onclick = () => say(b.dataset.say));
  $$('[data-del]', $('#view')).forEach(b => b.onclick = () => {
    me().words = me().words.filter(w => w.en !== b.dataset.del); save(); ROUTES.words();
  });
};

ROUTES.duel = () => {
  const ids = ['rafael', 'shani'];
  const qs = shuffle(DUEL).slice(0, 5);
  const score = { rafael: 0, shani: 0 };
  const xpEarned = { rafael: 0, shani: 0 };
  const name = id => DB.players[id].name;
  let r = 0;
  const view = $('#view');
  view.innerHTML = `<div class="progress"><button class="link" data-go="home">יציאה</button><span class="small muted" id="rn"></span></div><div id="stage"></div>`;
  $('[data-go]', view).onclick = () => go('home');
  const stage = $('#stage', view);

  function turn(id) {
    $('#rn', view).textContent = `סיבוב ${r + 1} מתוך ${qs.length}`;
    stage.innerHTML = `<div class="card stack center">
      <span class="lbl">התור של</span><h2>${esc(name(id))}</h2>
      <p class="muted small">העבירו את הטלפון ולא להציץ בתשובה של השני.</p>
      <button class="btn wide" id="ready">קדימה, מתחילים</button></div>`;
    $('#ready', stage).onclick = () => {
      const q = qs[r];
      mcq(stage, { label: `${name(id)} · סיבוב ${r + 1}`, prompt: q.q, en: true, opts: q.opts, a: q.a, hidden: true }, res => {
        if (res.ok) { score[id]++; xpEarned[id] += 5; }
        if (id === ids[0]) turn(ids[1]); else reveal();
      });
    };
  }

  function reveal() {
    const q = qs[r];
    const line = id => `<div class="row between"><b>${esc(name(id))}</b><span>${score[id]} נק׳</span></div>`;
    stage.innerHTML = `<div class="card stack">
      <span class="lbl">התשובה הנכונה</span>
      <div class="prompt en">${esc(q.opts[q.a])}</div>
      <p class="muted small">${esc(q.q)}</p>
      ${line('rafael')}${line('shani')}
      <button class="btn wide" id="nextr">${r + 1 < qs.length ? 'סיבוב הבא' : 'תוצאות'}</button></div>`;
    $('#nextr', stage).onclick = () => {
      r++;
      if (r < qs.length) turn(ids[0]); else results();
    };
  }

  function results() {
    const won = score.rafael === score.shani ? null : score.rafael > score.shani ? 'rafael' : 'shani';
    ids.forEach(id => { DB.players[id].duels++; addXP(xpEarned[id] + (won === id ? 10 : 0), id); });
    save(); renderTop();
    stage.innerHTML = `<div class="card stack center">
      <h2>${won ? `הניצחון של ${esc(name(won))}!` : 'תיקו!'}</h2>
      <div class="score-line">${esc(name('rafael'))} ${score.rafael} · ${esc(name('shani'))} ${score.shani}</div>
      <p class="muted small">נקודות ה-XP נוספו לכל אחד בפרופיל שלו.</p>
      <div class="row center"><button class="btn" id="again">דו-קרב נוסף</button><button class="ghost" data-go="home">לבית</button></div></div>`;
    $('#again', stage).onclick = () => go('duel');
    $('[data-go]', stage).onclick = () => go('home');
  }

  turn(ids[0]);
};

ROUTES.profile = () => {
  const p = me();
  $('#view').innerHTML = `<h2>הפרופיל של ${esc(p.name)}</h2>
    <div class="card stack">
      <label>שם<input id="pn" value="${esc(p.name)}" maxlength="12"></label>
      <div><span class="lbl">רמה</span><div class="row">${LEVELS.map(l => `<button class="pill ${p.level === l ? 'on' : ''}" data-l="${l}">${l}</button>`).join('')}</div></div>
      <div><span class="lbl">תחומים שמעניינים אותי</span><div class="row">${Object.entries(TRACKS).map(([k, v]) => `<button class="pill ${p.tracks.includes(k) ? 'on' : ''}" data-t="${k}">${v}</button>`).join('')}</div></div>
      <label>מהירות דיבור: <span id="rv">${p.rate}</span><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${p.rate}"></label>
      <label class="inline"><input type="checkbox" id="sp" ${p.speak ? 'checked' : ''}> הקראה אוטומטית של הדמות והמילים</label>
      <button class="ghost wide" id="test">בדיקת קול</button>
    </div>
    <div class="row center" style="margin-top:16px"><button class="link danger" id="reset">איפוס ההתקדמות של ${esc(p.name)}</button></div>`;
  $('#pn').oninput = e => { p.name = e.target.value.trim() || p.name; save(); renderTop(); };
  $$('[data-l]').forEach(b => b.onclick = () => { p.level = b.dataset.l; save(); ROUTES.profile(); });
  $$('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if (p.tracks.includes(t)) { if (p.tracks.length > 1) p.tracks = p.tracks.filter(x => x !== t); }
    else p.tracks.push(t);
    save(); ROUTES.profile();
  });
  $('#rate').oninput = e => { p.rate = +e.target.value; $('#rv').textContent = p.rate; save(); };
  $('#sp').onchange = e => { p.speak = e.target.checked; save(); };
  $('#test').onclick = () => say('Hi! This is how fast I will talk to you.');
  $('#reset').onclick = () => {
    if (!confirm(`למחוק את כל ההתקדמות של ${p.name}? זה לא ניתן לביטול.`)) return;
    DB.players[DB.cur] = blank(p.name, p.level, p.tracks); save(); go('home');
  };
};

/* ---------- boot ---------- */

$('#who').addEventListener('click', e => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  DB.cur = b.dataset.p; save();
  go(ROUTE === 'profile' ? 'profile' : ROUTE);
});
$('#brand').onclick = () => go('home');
window.addEventListener('pagehide', save);

go('home');
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
